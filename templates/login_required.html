{% extends "base.html" %}
{% block title %}Вход — Cz Garant{% endblock %}
{% block content %}
<section class="page-section login-required">
  <h1 class="section-title-left">Личный кабинет</h1>
  <p class="dashboard-card-sub">
    Чтобы открыть личный кабинет — войдите через Telegram. Это займёт пару секунд.
  </p>

  <div class="login-required-widget">
    <script async src="https://telegram.org/js/telegram-widget.js?22"
      data-telegram-login="{{ bot_username }}"
      data-size="large"
      data-radius="8"
      data-auth-url="{{ request.url_for('telegram_login_callback') }}"
      data-request-access="write"></script>
  </div>
</section>
{% endblock %}
